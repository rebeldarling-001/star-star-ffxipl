<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Captain — Auction Center — FREEFIREXIPL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0705;
      --surface: #1a130b;
      --surface-2: #221909;
      --gold: #f0b93d;
      --gold-deep: #b3811f;
      --gold-pale: #fbe4a6;
      --ink: #f4ecd8;
      --ink-dim: #a9997d;
      --ink-faint: #6b5f4c;
      --live: #ff4433;
      --good: #4ade80;
      --line: rgba(240, 185, 61, 0.14);
      --tc: var(--gold);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family: 'Rajdhani', sans-serif;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .display {
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .mono {
      font-family: 'Space Mono', monospace;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 18px;
      background: rgba(10, 7, 5, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .crest {
      width: 26px;
      height: 26px;
      background: linear-gradient(145deg, var(--gold-pale), var(--gold) 60%, var(--gold-deep));
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 100%, 50% 76%, 21% 100%, 32% 57%, 2% 35%, 39% 35%);
      flex-shrink: 0;
    }

    .brand-text {
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .brand-text b {
      color: var(--gold);
    }

    .tag {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .conn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--ink-faint);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink-faint);
    }

    .dot.on {
      background: var(--good);
      box-shadow: 0 0 8px var(--good);
    }

    .team-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--tc);
    }

    .team-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--tc);
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
    }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 14px;
    }

    .login-card {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
    }

    .login-card h1 {
      font-size: 20px;
      margin-top: 10px;
      color: var(--gold-pale);
    }

    .login-card p {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 6px;
      line-height: 1.5;
    }

    .field {
      margin-top: 16px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 9.5px;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--gold-deep);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 18px;
      border-radius: 11px;
      font-size: 13px;
      letter-spacing: 0.06em;
      font-weight: 700;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-pale), var(--gold) 55%, var(--gold-deep));
      color: #1a1206;
      width: 100%;
      margin-top: 18px;
    }

    .err-msg {
      margin-top: 14px;
      font-size: 12px;
      color: var(--live);
      min-height: 16px;
    }

    main {
      display: none;
      padding: 16px;
    }

    main.show {
      display: block;
    }

    .section-title {
      margin: 24px 2px 12px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    /* MY TEAM STRIP */
    .my-strip {
      display: flex;
      gap: 10px;
    }

    .stat-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-box .lbl {
      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .stat-box .val {
      margin-top: 5px;
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold-pale);
    }

    /* BLOCK */
    .block-card {
      position: relative;
      background: radial-gradient(ellipse 130% 90% at 50% -10%, rgba(240, 185, 61, 0.10), transparent 60%), var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      overflow: hidden;
      margin-top: 14px;
    }

    .status-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 100px;
      border: 1px solid var(--line);
      color: var(--ink-faint);
    }

    .status-pill.live {
      color: var(--live);
      border-color: var(--live);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .status-pill.sold {
      color: var(--good);
      border-color: var(--good);
    }

    .status-pill.unsold {
      color: var(--ink-faint);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.45;
      }
    }

    .block-empty {
      text-align: center;
      padding: 34px 10px;
      color: var(--ink-faint);
      font-size: 13px;
    }

    .block-player {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .block-avatar {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      color: var(--gold);
      flex-shrink: 0;
      overflow: hidden;
    }

    .block-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .block-name {
      font-family: 'Anton', sans-serif;
      font-size: 19px;
      color: var(--gold-pale);
      line-height: 1.1;
    }

    .block-meta {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    .block-bid-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .bid-box {
      flex: 1;
      background: rgba(240, 185, 61, 0.05);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .bid-box .lbl {
      font-size: 8.5px;
      letter-spacing: 0.1em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .bid-box .val {
      margin-top: 5px;
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-pale);
    }

    .bid-box .val.team {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .leading-banner {
      margin-top: 12px;
      padding: 9px;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .leading-banner.you {
      background: rgba(74, 222, 128, 0.12);
      color: var(--good);
    }

    .leading-banner.other {
      background: rgba(255, 68, 51, 0.08);
      color: #ff8a7c;
    }

    /* RESULT ANNOUNCEMENT */
    #announce {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      z-index: 300;
      width: calc(100% - 32px);
      max-width: 448px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #announce.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .announce-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .announce-card.win {
      border-color: var(--good);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.14), var(--surface) 70%);
    }

    .announce-card.info {
      border-color: var(--line);
    }

    .announce-card.unsold {
      border-color: var(--ink-faint);
    }

    .announce-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .announce-body {
      flex: 1;
      min-width: 0;
    }

    .announce-title {
      font-family: 'Anton', sans-serif;
      font-size: 13.5px;
      letter-spacing: 0.02em;
      color: var(--gold-pale);
    }

    .announce-card.win .announce-title {
      color: var(--good);
    }

    .announce-sub {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    .announce-close {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px;
    }

    /* BID CONTROLS */
    .bid-controls {
      margin-top: 16px;
    }

    .quick-bids {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .quick-bid-btn {
      padding: 13px 6px;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--gold-pale);
      font-family: 'Space Mono', monospace;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .quick-bid-btn:active {
      transform: scale(0.96);
      background: rgba(240, 185, 61, 0.12);
    }

    .custom-bid-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .custom-bid-row input {
      flex: 1;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
    }

    .bid-feedback {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      color: var(--live);
    }

    .bid-feedback.ok {
      color: var(--good);
    }

    /* FEED / SQUAD */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    .feed-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 12px;
    }

    .feed-row:last-child {
      border-bottom: none;
    }

    .feed-team-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--fc, var(--gold));
      flex-shrink: 0;
    }

    .feed-amt {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      color: var(--gold-pale);
      flex-shrink: 0;
    }

    .feed-time {
      font-size: 9.5px;
      color: var(--ink-faint);
      flex-shrink: 0;
    }

    .squad-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 13px;
    }

    .squad-row:last-child {
      border-bottom: none;
    }

    .squad-price {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      color: var(--gold-pale);
      font-size: 12px;
    }

    .empty-note {
      font-size: 12px;
      color: var(--ink-faint);
      text-align: center;
      padding: 14px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="crest" style="margin:0 auto;"></div>
      <h1 class="display">Captain Login</h1>
      <p>Pick your franchise and enter your team passcode to join the auction room.</p>
      <div class="field">
        <label>Team</label>
        <select id="teamSelect">
          <option value="">Loading teams…</option>
        </select>
      </div>
      <div class="field">
        <label>Passcode</label>
        <input type="password" id="passInput" placeholder="••••••" autocomplete="off">
      </div>
      <button class="btn btn-gold" id="loginBtn">Enter Auction Room</button>
      <div class="err-msg" id="loginErr"></div>
    </div>
  </div>

  <!-- RESULT ANNOUNCEMENT -->
  <div id="announce">
    <div class="announce-card" id="announceCard">
      <span class="announce-icon" id="announceIcon"></span>
      <div class="announce-body">
        <div class="announce-title" id="announceTitle"></div>
        <div class="announce-sub" id="announceSub"></div>
      </div>
      <button class="announce-close" id="announceClose" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <!-- APP -->
  <header id="appHeader" style="display:none;">
    <div class="brand">
      <div class="crest"></div>
      <div>
        <div class="brand-text">FREEFIRE<b>XIPL</b></div>
        <div class="tag">Auction Room</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="team-chip"><span class="team-dot"></span><span id="myTeamName"></span></div>
      <button class="logout-btn" id="logoutBtn">Exit</button>
    </div>
  </header>

  <main id="app">
    <div class="conn" style="justify-content:flex-end; display:flex; margin-bottom:4px;"><span class="dot"
        id="connDot"></span><span id="connLabel" style="margin-left:5px;">Connecting</span></div>

    <div class="my-strip">
      <div class="stat-box">
        <div class="lbl">Purse Left</div>
        <div class="val" id="myPurse">—</div>
      </div>
      <div class="stat-box">
        <div class="lbl">Squad</div>
        <div class="val" id="mySquad">—</div>
      </div>
      <div class="stat-box">
        <div class="lbl">Min Increment</div>
        <div class="val" id="myInc">—</div>
      </div>
    </div>

    <div class="block-card" id="blockCard"></div>

    <div class="section-title">Bid Feed</div>
    <div class="card">
      <div id="feedList">
        <p class="empty-note">No bids yet this session.</p>
      </div>
    </div>

    <div class="section-title">My Squad</div>
    <div class="card">
      <div id="squadList">
        <p class="empty-note">No players won yet.</p>
      </div>
    </div>
  </main>

  <script>
    // ============================================================
    // CONFIG — paste your Supabase project values here
    // ============================================================
    const SUPABASE_URL = "https://izoysudepwjajyqqurfl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6b3lzdWRlcHdqYWp5cXF1cmZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mjg1NDgsImV4cCI6MjEwMTIwNDU0OH0.hSB09Hf56B8wJdFbHzrrI-F6ukw9SOm7FcwTFK1obLg";
    // ============================================================

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let MY_TEAM = JSON.parse(sessionStorage.getItem('ffx_team') || 'null'); // {id, name, color, code}
    let MY_PASSCODE = sessionStorage.getItem('ffx_team_pass') || null;
    let TEAMS = [], PLAYERS = [], STATE = null, RECENT_BIDS = [];

    function fmtMoney(n) {
      if (n === null || n === undefined) return '—';
      n = Number(n);
      if (Math.abs(n) >= 100) return '₹' + (n / 100).toFixed(2).replace(/\.?0+$/, '') + 'Cr';
      return '₹' + (Number.isInteger(n) ? n : n.toFixed(2)) + 'L';
    }
    function teamById(id) { return TEAMS.find(t => t.id === id); }

    // ---------------- LOGIN ----------------
    async function loadTeamOptions() {
      const { data } = await sb.from('teams').select('id,code,name').order('code');
      const sel = document.getElementById('teamSelect');
      sel.innerHTML = '<option value="">Select your team…</option>' +
        (data || []).map(t => `<option value="${t.code}">${t.code} — ${t.name}</option>`).join('');
    }
    loadTeamOptions();

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    async function doLogin() {
      const code = document.getElementById('teamSelect').value;
      const pass = document.getElementById('passInput').value.trim();
      const errEl = document.getElementById('loginErr');
      errEl.textContent = '';
      if (!code || !pass) { errEl.textContent = 'Select your team and enter the passcode.'; return; }
      const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Checking…';
      const { data, error } = await sb.rpc('team_login', { p_code: code, p_passcode: pass });
      btn.disabled = false; btn.textContent = 'Enter Auction Room';
      if (error || !data || data.length === 0) { errEl.textContent = 'Wrong team or passcode.'; return; }
      MY_TEAM = { id: data[0].team_id, name: data[0].team_name, color: data[0].team_color, code };
      MY_PASSCODE = pass;
      sessionStorage.setItem('ffx_team', JSON.stringify(MY_TEAM));
      sessionStorage.setItem('ffx_team_pass', pass);
      enterApp();
    }
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('ffx_team'); sessionStorage.removeItem('ffx_team_pass');
      location.reload();
    });
    if (MY_TEAM && MY_PASSCODE) { enterApp(); }

    function enterApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appHeader').style.display = 'flex';
      document.getElementById('app').classList.add('show');
      document.documentElement.style.setProperty('--tc', MY_TEAM.color);
      document.getElementById('myTeamName').textContent = MY_TEAM.code;
      document.querySelector('.team-dot').style.background = MY_TEAM.color;
      document.querySelector('.team-chip').style.color = MY_TEAM.color;
      fetchAll();
      subscribeRealtime();
    }

    // ---------------- DATA ----------------
    async function fetchAll() {
      const [teamsRes, playersRes, stateRes, bidsRes] = await Promise.all([
        sb.from('teams').select('*').order('code'),
        sb.from('players').select('*').order('display_order'),
        sb.from('auction_state').select('*').eq('id', 1).single(),
        sb.from('bids').select('*').order('created_at', { ascending: false }).limit(20)
      ]);
      TEAMS = teamsRes.data || [];
      PLAYERS = playersRes.data || [];
      STATE = stateRes.data || null;
      RECENT_BIDS = bidsRes.data || [];
      detectAndAnnounce(PLAYERS);
      renderAll();
    }

    // ---------------- RESULT ANNOUNCEMENT ----------------
    let prevPlayersById = null; // null until first fetch completes, so we never spam past results on load
    let announceTimer = null;
    function detectAndAnnounce(newPlayers) {
      const newById = {};
      newPlayers.forEach(p => newById[p.id] = p);
      if (prevPlayersById) {
        for (const id in newById) {
          const now = newById[id], before = prevPlayersById[id];
          if (before && before.status !== now.status && (now.status === 'sold' || now.status === 'unsold')) {
            announceResult(now);
          }
        }
      }
      prevPlayersById = newById;
    }
    function announceResult(p) {
      if (p.status === 'sold') {
        const team = teamById(p.sold_to_team);
        const iWon = team && MY_TEAM && team.id === MY_TEAM.id;
        if (iWon) showAnnounce('win', '🎉', 'You won it!', `${p.name} joins your squad for ${fmtMoney(p.sold_price)}.`);
        else showAnnounce('info', '🔨', `${p.name} sold`, `${team ? team.name : 'Another team'} won for ${fmtMoney(p.sold_price)}.`);
      } else if (p.status === 'unsold') {
        showAnnounce('unsold', '🚫', `${p.name} went unsold`, `No team bid on them this time.`);
      }
    }
    function showAnnounce(kind, icon, title, sub) {
      const box = document.getElementById('announce');
      document.getElementById('announceCard').className = 'announce-card ' + kind;
      document.getElementById('announceIcon').textContent = icon;
      document.getElementById('announceTitle').textContent = title;
      document.getElementById('announceSub').textContent = sub;
      box.classList.add('show');
      clearTimeout(announceTimer);
      announceTimer = setTimeout(() => box.classList.remove('show'), 5000);
    }
    document.getElementById('announceClose').addEventListener('click', () => {
      document.getElementById('announce').classList.remove('show');
      clearTimeout(announceTimer);
    });

    let realtimeTimer = null;
    function subscribeRealtime() {
      const ch = sb.channel('team-room')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'auction_state' }, debouncedRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, debouncedRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, debouncedRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bids' }, debouncedRefresh)
        .subscribe(status => {
          const dot = document.getElementById('connDot'), lbl = document.getElementById('connLabel');
          if (status === 'SUBSCRIBED') { dot.classList.add('on'); lbl.textContent = 'Live'; }
          else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') { dot.classList.remove('on'); lbl.textContent = 'Offline'; }
        });
    }
    function debouncedRefresh() { clearTimeout(realtimeTimer); realtimeTimer = setTimeout(fetchAll, 150); }

    // ---------------- RENDER ----------------
    function renderAll() {
      const mine = teamById(MY_TEAM.id);
      if (mine) {
        document.getElementById('myPurse').textContent = fmtMoney(mine.purse_total - mine.purse_spent);
        const squadCount = PLAYERS.filter(p => p.sold_to_team === mine.id).length;
        document.getElementById('mySquad').textContent = squadCount + '/' + mine.squad_target;
      }
      document.getElementById('myInc').textContent = STATE ? fmtMoney(STATE.min_increment) : '—';
      renderBlock(); renderFeed(); renderSquad();
    }

    function renderBlock() {
      const el = document.getElementById('blockCard');
      if (!STATE || !STATE.current_player_id || STATE.status !== 'live') {
        el.innerHTML = `<div class="block-empty">${STATE && STATE.status === 'sold' ? 'Last player sold — waiting for the next one.' : STATE && STATE.status === 'unsold' ? 'Last player went unsold — waiting for the next one.' : 'No player on the block right now.'}</div>`;
        return;
      }
      const p = PLAYERS.find(x => x.id === STATE.current_player_id);
      if (!p) { el.innerHTML = `<div class="block-empty">Loading…</div>`; return; }
      const leadTeam = STATE.current_bid_team ? teamById(STATE.current_bid_team) : null;
      const iLead = leadTeam && leadTeam.id === MY_TEAM.id;
      const mine = teamById(MY_TEAM.id);
      const remaining = mine ? mine.purse_total - mine.purse_spent : 0;
      const squadFull = mine ? PLAYERS.filter(x => x.sold_to_team === mine.id).length >= mine.squad_target : false;

      const nextMin = leadTeam ? STATE.current_bid + STATE.min_increment : STATE.current_bid;
      const inc = STATE.min_increment;
      const quickAmounts = [nextMin, nextMin + inc, nextMin + inc * 2];

      el.innerHTML = `
      <span class="status-pill live">LIVE</span>
      <div class="block-player">
        <div class="block-avatar">${p.image_url ? `<img src="${p.image_url}" onerror="this.parentElement.textContent='${(p.name || '?')[0]}'">` : (p.name || '?')[0]}</div>
        <div>
          <div class="block-name">${p.name}</div>
          <div class="block-meta">${p.role || ''}${p.category ? ' · ' + p.category : ''} · Base ${fmtMoney(p.base_price)}</div>
        </div>
      </div>
      <div class="block-bid-row">
        <div class="bid-box"><div class="lbl">Current Bid</div><div class="val">${fmtMoney(STATE.current_bid)}</div></div>
        <div class="bid-box"><div class="lbl">Leading</div><div class="val team" style="color:${leadTeam ? leadTeam.color : 'var(--ink-faint)'}">${leadTeam ? leadTeam.code : '— none —'}</div></div>
      </div>
      ${leadTeam ? `<div class="leading-banner ${iLead ? 'you' : 'other'}">${iLead ? 'You are leading this bid' : leadTeam.code + ' is currently leading'}</div>` : ''}
      <div class="bid-controls">
        ${squadFull ? `<div class="bid-feedback">Your squad is full — you can't bid.</div>` :
          iLead ? `<div class="bid-feedback ok">You're already the top bid.</div>` : `
          <div class="quick-bids">
            ${quickAmounts.map(a => `<button class="quick-bid-btn" data-bid="${a}" ${a > remaining ? 'disabled style="opacity:0.35"' : ''}>${fmtMoney(a)}</button>`).join('')}
          </div>
          <div class="custom-bid-row">
            <input type="number" id="customBidInput" placeholder="Custom amount (₹L)" class="mono">
            <button class="btn btn-gold" style="margin-top:0; width:auto; padding:13px 16px;" id="customBidBtn">Bid</button>
          </div>`}
        <div class="bid-feedback" id="bidFeedback"></div>
      </div>
    `;
      el.querySelectorAll('[data-bid]').forEach(btn => {
        btn.addEventListener('click', () => submitBid(parseFloat(btn.dataset.bid)));
      });
      const customBtn = document.getElementById('customBidBtn');
      if (customBtn) {
        customBtn.addEventListener('click', () => {
          const val = parseFloat(document.getElementById('customBidInput').value);
          if (isNaN(val)) { showFeedback('Enter a valid amount.', false); return; }
          submitBid(val);
        });
      }
    }

    function showFeedback(msg, ok) {
      const el = document.getElementById('bidFeedback');
      if (!el) return;
      el.textContent = msg; el.className = 'bid-feedback' + (ok ? ' ok' : '');
    }

    async function submitBid(amount) {
      showFeedback('Placing bid…', false);
      const { data, error } = await sb.rpc('place_bid', {
        p_team_id: MY_TEAM.id, p_passcode: MY_PASSCODE, p_amount: amount
      });
      if (error) { showFeedback(error.message || 'Bid failed', false); return; }
      showFeedback('Bid placed — you\'re leading!', true);
    }

    function renderFeed() {
      const el = document.getElementById('feedList');
      if (RECENT_BIDS.length === 0) { el.innerHTML = `<p class="empty-note">No bids yet this session.</p>`; return; }
      el.innerHTML = RECENT_BIDS.map(b => {
        const t = teamById(b.team_id);
        const time = new Date(b.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `<div class="feed-row"><span class="feed-team-dot" style="--fc:${t ? t.color : '#999'}"></span>
        <span>${t ? t.code : '—'} bid</span>
        <span class="feed-time">${time}</span>
        <span class="feed-amt">${fmtMoney(b.amount)}</span></div>`;
      }).join('');
    }

    function renderSquad() {
      const el = document.getElementById('squadList');
      const mine = PLAYERS.filter(p => p.sold_to_team === MY_TEAM.id);
      if (mine.length === 0) { el.innerHTML = `<p class="empty-note">No players won yet.</p>`; return; }
      el.innerHTML = mine.map(p => `
      <div class="squad-row">
        <span>${p.name}</span>
        <span class="tag" style="color:var(--ink-faint); font-size:10px;">${p.role || ''}</span>
        <span class="squad-price">${fmtMoney(p.sold_price)}</span>
      </div>`).join('');
    }
  </script>
</body>

</html>
