<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Live Auction — FREEFIREXIPL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0705;
      --surface: #1a130b;
      --surface-2: #221909;
      --gold: #f0b93d;
      --gold-deep: #b3811f;
      --gold-pale: #fbe4a6;
      --ink: #f4ecd8;
      --ink-dim: #a9997d;
      --ink-faint: #6b5f4c;
      --live: #ff4433;
      --good: #4ade80;
      --line: rgba(240, 185, 61, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family: 'Rajdhani', sans-serif;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
      position: relative;
      overflow-x: hidden;
    }

    .display {
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .mono {
      font-family: 'Space Mono', monospace;
    }

    .embers {
      position: fixed;
      inset: 0;
      max-width: 480px;
      margin: 0 auto;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ember {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      box-shadow: 0 0 6px 1px rgba(240, 185, 61, 0.8);
      animation-name: floatUp;
      animation-timing-function: ease-in;
      animation-iteration-count: infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }

      10% {
        opacity: 0.9;
      }

      90% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(-720px) translateX(var(--drift, 20px));
        opacity: 0;
      }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 18px;
      background: rgba(10, 7, 5, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .crest {
      width: 28px;
      height: 28px;
      background: linear-gradient(145deg, var(--gold-pale), var(--gold) 60%, var(--gold-deep));
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 100%, 50% 76%, 21% 100%, 32% 57%, 2% 35%, 39% 35%);
    }

    .brand-text {
      font-size: 15px;
      letter-spacing: 0.05em;
    }

    .brand-text b {
      color: var(--gold);
    }

    .tag {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .conn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink-faint);
    }

    .dot.on {
      background: var(--good);
      box-shadow: 0 0 8px var(--good);
    }

    main {
      position: relative;
      z-index: 1;
      padding: 16px;
    }

    .section-title {
      margin: 26px 2px 12px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    /* HERO BLOCK */
    .block-card {
      position: relative;
      background: radial-gradient(ellipse 140% 100% at 50% -10%, rgba(240, 185, 61, 0.14), transparent 62%), var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px 20px;
      overflow: hidden;
      text-align: center;
    }

    .status-pill {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--line);
      color: var(--ink-faint);
      margin-bottom: 14px;
    }

    .status-pill.live {
      color: var(--live);
      border-color: var(--live);
      animation: pulse 1.3s ease-in-out infinite;
    }

    .status-pill.sold {
      color: var(--good);
      border-color: var(--good);
    }

    .status-pill.unsold {
      color: var(--ink-faint);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* RESULT ANNOUNCEMENT */
    #announce {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      z-index: 300;
      width: calc(100% - 32px);
      max-width: 448px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #announce.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .announce-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .announce-card.win {
      border-color: var(--good);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.14), var(--surface) 70%);
    }

    .announce-card.unsold {
      border-color: var(--ink-faint);
    }

    .announce-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .announce-body {
      flex: 1;
      min-width: 0;
    }

    .announce-title {
      font-family: 'Anton', sans-serif;
      font-size: 13.5px;
      letter-spacing: 0.02em;
      color: var(--gold-pale);
    }

    .announce-card.win .announce-title {
      color: var(--good);
    }

    .announce-sub {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    .announce-close {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px;
    }

    .block-empty {
      padding: 40px 10px;
      color: var(--ink-faint);
      font-size: 14px;
    }

    .block-avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto;
      border-radius: 20px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 32px;
      color: var(--gold);
      overflow: hidden;
    }

    .block-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .block-name {
      margin-top: 14px;
      font-family: 'Anton', sans-serif;
      font-size: 26px;
      color: var(--gold-pale);
      line-height: 1.1;
    }

    .block-meta {
      margin-top: 4px;
      font-size: 12.5px;
      color: var(--ink-faint);
    }

    .block-bid-big {
      margin-top: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(240, 185, 61, 0.4);
    }

    .block-bid-lbl {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .block-leader {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
    }

    .block-leader .dot2 {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    /* TEAMS GRID */
    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .team-card {
      border-radius: 14px;
      padding: 13px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .team-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--tc, var(--gold));
      opacity: 0.06;
    }

    .team-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .team-abbr {
      font-family: 'Anton', sans-serif;
      font-size: 14px;
      color: var(--tc, var(--gold));
    }

    .team-squad {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-faint);
    }

    .purse-bar {
      position: relative;
      height: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      margin-top: 9px;
      overflow: hidden;
    }

    .purse-bar-fill {
      height: 100%;
      background: var(--tc, var(--gold));
      border-radius: 6px;
    }

    .purse-nums {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--ink-dim);
    }

    /* FEED */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      position: relative;
      z-index: 1;
    }

    .feed-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 12.5px;
    }

    .feed-row:last-child {
      border-bottom: none;
    }

    .feed-team-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--fc, var(--gold));
      flex-shrink: 0;
    }

    .feed-amt {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      color: var(--gold-pale);
      flex-shrink: 0;
    }

    .feed-time {
      font-size: 9.5px;
      color: var(--ink-faint);
      flex-shrink: 0;
    }

    .results-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 13px;
    }

    .results-row:last-child {
      border-bottom: none;
    }

    .results-price {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .empty-note {
      font-size: 12px;
      color: var(--ink-faint);
      text-align: center;
      padding: 14px;
    }
  </style>
</head>

<body>

  <div class="embers" id="embers"></div>

  <!-- RESULT ANNOUNCEMENT -->
  <div id="announce">
    <div class="announce-card" id="announceCard">
      <span class="announce-icon" id="announceIcon"></span>
      <div class="announce-body">
        <div class="announce-title" id="announceTitle"></div>
        <div class="announce-sub" id="announceSub"></div>
      </div>
      <button class="announce-close" id="announceClose" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <header>
    <div class="brand">
      <div class="crest"></div>
      <div>
        <div class="brand-text">FREEFIRE<b>XIPL</b></div>
        <div class="tag">Live Auction</div>
      </div>
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connLabel">Connecting</span></div>
  </header>

  <main>
    <div class="section-title">On The Block</div>
    <div class="block-card" id="blockCard"></div>

    <div class="section-title">Franchises</div>
    <div class="teams-grid" id="teamsGrid"></div>

    <div class="section-title">Bid Feed</div>
    <div class="card">
      <div id="feedList">
        <p class="empty-note">Waiting for the first bid…</p>
      </div>
    </div>

    <div class="section-title">Sold / Unsold</div>
    <div class="card">
      <div id="resultsList">
        <p class="empty-note">No results yet.</p>
      </div>
    </div>
  </main>

  <script>
    // ============================================================
    // CONFIG — paste your Supabase project values here
    // ============================================================
    const SUPABASE_URL = "https://izoysudepwjajyqqurfl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6b3lzdWRlcHdqYWp5cXF1cmZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mjg1NDgsImV4cCI6MjEwMTIwNDU0OH0.hSB09Hf56B8wJdFbHzrrI-F6ukw9SOm7FcwTFK1obLg";
    // ============================================================

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let TEAMS = [], PLAYERS = [], STATE = null, RECENT_BIDS = [];

    function fmtMoney(n) {
      if (n === null || n === undefined) return '—';
      n = Number(n);
      if (Math.abs(n) >= 100) return '₹' + (n / 100).toFixed(2).replace(/\.?0+$/, '') + 'Cr';
      return '₹' + (Number.isInteger(n) ? n : n.toFixed(2)) + 'L';
    }
    function teamById(id) { return TEAMS.find(t => t.id === id); }

    // Embers
    const emberField = document.getElementById('embers');
    for (let i = 0; i < 14; i++) {
      const e = document.createElement('div'); e.className = 'ember';
      e.style.left = Math.random() * 100 + '%';
      e.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      e.style.animationDuration = (6 + Math.random() * 6) + 's';
      e.style.animationDelay = (Math.random() * 8) + 's';
      emberField.appendChild(e);
    }

    async function fetchAll() {
      const [teamsRes, playersRes, stateRes, bidsRes] = await Promise.all([
        sb.from('teams').select('*').order('code'),
        sb.from('players').select('*').order('display_order'),
        sb.from('auction_state').select('*').eq('id', 1).single(),
        sb.from('bids').select('*').order('created_at', { ascending: false }).limit(20)
      ]);
      TEAMS = teamsRes.data || [];
      PLAYERS = playersRes.data || [];
      STATE = stateRes.data || null;
      RECENT_BIDS = bidsRes.data || [];
      detectAndAnnounce(PLAYERS);
      renderAll();
    }

    // ---------------- RESULT ANNOUNCEMENT ----------------
    let prevPlayersById = null; // null until first fetch completes, so we never spam past results on load
    let announceTimer = null;
    function detectAndAnnounce(newPlayers) {
      const newById = {};
      newPlayers.forEach(p => newById[p.id] = p);
      if (prevPlayersById) {
        for (const id in newById) {
          const now = newById[id], before = prevPlayersById[id];
          if (before && before.status !== now.status && (now.status === 'sold' || now.status === 'unsold')) {
            announceResult(now);
          }
        }
      }
      prevPlayersById = newById;
    }
    function announceResult(p) {
      if (p.status === 'sold') {
        const team = teamById(p.sold_to_team);
        showAnnounce('win', '🔨', `${p.name} — SOLD`, `${team ? team.name : 'A team'} wins for ${fmtMoney(p.sold_price)}.`);
      } else if (p.status === 'unsold') {
        showAnnounce('unsold', '🚫', `${p.name} went unsold`, `No team bid on them this time.`);
      }
    }
    function showAnnounce(kind, icon, title, sub) {
      const box = document.getElementById('announce');
      document.getElementById('announceCard').className = 'announce-card ' + kind;
      document.getElementById('announceIcon').textContent = icon;
      document.getElementById('announceTitle').textContent = title;
      document.getElementById('announceSub').textContent = sub;
      box.classList.add('show');
      clearTimeout(announceTimer);
      announceTimer = setTimeout(() => box.classList.remove('show'), 5000);
    }
    document.getElementById('announceClose').addEventListener('click', () => {
      document.getElementById('announce').classList.remove('show');
      clearTimeout(announceTimer);
    });

    let realtimeTimer = null;
    function subscribeRealtime() {
      sb.channel('viewer-room')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'auction_state' }, debouncedRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, debouncedRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, debouncedRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bids' }, debouncedRefresh)
        .subscribe(status => {
          const dot = document.getElementById('connDot'), lbl = document.getElementById('connLabel');
          if (status === 'SUBSCRIBED') { dot.classList.add('on'); lbl.textContent = 'Live'; }
          else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') { dot.classList.remove('on'); lbl.textContent = 'Offline'; }
        });
    }
    function debouncedRefresh() { clearTimeout(realtimeTimer); realtimeTimer = setTimeout(fetchAll, 150); }

    function renderAll() { renderBlock(); renderTeams(); renderFeed(); renderResults(); }

    function renderBlock() {
      const el = document.getElementById('blockCard');
      if (!STATE || !STATE.current_player_id) {
        el.innerHTML = `<div class="block-empty">The auction hasn't started yet.<br>Stay tuned.</div>`;
        return;
      }
      const p = PLAYERS.find(x => x.id === STATE.current_player_id);
      if (!p) { el.innerHTML = `<div class="block-empty">Loading…</div>`; return; }
      const leadTeam = STATE.current_bid_team ? teamById(STATE.current_bid_team) : null;
      const statusClass = STATE.status === 'live' ? 'live' : (STATE.status === 'sold' ? 'sold' : 'unsold');

      el.innerHTML = `
      <span class="status-pill ${statusClass}">${STATE.status.toUpperCase()}</span>
      <div class="block-avatar">${p.image_url ? `<img src="${p.image_url}" onerror="this.parentElement.textContent='${(p.name || '?')[0]}'">` : (p.name || '?')[0]}</div>
      <div class="block-name">${p.name}</div>
      <div class="block-meta">${p.role || ''}${p.category ? ' · ' + p.category : ''} · Base ${fmtMoney(p.base_price)}</div>
      <div class="block-bid-big">${STATE.status === 'sold' ? fmtMoney(p.sold_price) : fmtMoney(STATE.current_bid)}</div>
      <div class="block-bid-lbl">${STATE.status === 'sold' ? 'Sold Price' : STATE.status === 'unsold' ? 'Went Unsold' : 'Current Bid'}</div>
      ${leadTeam ? `<div class="block-leader"><span class="dot2" style="background:${leadTeam.color}"></span>${STATE.status === 'sold' ? leadTeam.name : leadTeam.name + ' leading'}</div>` : ''}
    `;
    }

    function renderTeams() {
      const el = document.getElementById('teamsGrid');
      el.innerHTML = TEAMS.map(t => {
        const squadCount = PLAYERS.filter(p => p.sold_to_team === t.id).length;
        const remaining = t.purse_total - t.purse_spent;
        const pct = t.purse_total > 0 ? Math.min(100, (t.purse_spent / t.purse_total) * 100) : 0;
        return `
      <div class="team-card" style="--tc:${t.color}">
        <div class="team-card-top">
          <span class="team-abbr">${t.code}</span>
          <span class="team-squad">${squadCount}/${t.squad_target}</span>
        </div>
        <div style="font-size:10.5px; color:var(--ink-faint); margin-top:2px;">${t.name}</div>
        <div class="purse-bar"><div class="purse-bar-fill" style="width:${pct}%"></div></div>
        <div class="purse-nums"><span>${fmtMoney(remaining)} left</span><span>${fmtMoney(t.purse_total)}</span></div>
      </div>`;
      }).join('');
    }

    function renderFeed() {
      const el = document.getElementById('feedList');
      if (RECENT_BIDS.length === 0) { el.innerHTML = `<p class="empty-note">Waiting for the first bid…</p>`; return; }
      el.innerHTML = RECENT_BIDS.map(b => {
        const t = teamById(b.team_id);
        const time = new Date(b.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `<div class="feed-row"><span class="feed-team-dot" style="--fc:${t ? t.color : '#999'}"></span>
        <span>${t ? t.name : '—'}</span>
        <span class="feed-time">${time}</span>
        <span class="feed-amt">${fmtMoney(b.amount)}</span></div>`;
      }).join('');
    }

    function renderResults() {
      const el = document.getElementById('resultsList');
      const done = PLAYERS.filter(p => p.status === 'sold' || p.status === 'unsold').sort((a, b) => (b.display_order || 0) - (a.display_order || 0));
      if (done.length === 0) { el.innerHTML = `<p class="empty-note">No results yet.</p>`; return; }
      el.innerHTML = done.map(p => {
        const t = p.sold_to_team ? teamById(p.sold_to_team) : null;
        return `<div class="results-row">
        <span>${p.name}</span>
        ${p.status === 'sold'
            ? `<span class="results-price mono" style="color:${t ? t.color : 'var(--gold-pale)'}">${t ? t.code : ''} · ${fmtMoney(p.sold_price)}</span>`
            : `<span class="results-price mono" style="color:var(--ink-faint);">Unsold</span>`}
      </div>`;
      }).join('');
    }

    fetchAll();
    subscribeRealtime();
  </script>
</body>

</html>
