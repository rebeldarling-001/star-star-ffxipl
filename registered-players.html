<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Registered Players — FREEFIREXIPL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0a0705;
            --surface: #170f08;
            --surface-2: #20160b;
            --gold: #eab34a;
            --gold-deep: #a9791f;
            --gold-pale: #f6dfa3;
            --gold-line: rgba(234, 179, 74, 0.22);
            --ink: #f4ecd8;
            --ink-dim: #a9997d;
            --ink-faint: #6b5f4c;
            --live: #ff4433;
            --good: #4ade80;
            --line: rgba(240, 185, 61, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            background: var(--bg);
        }

        body {
            color: var(--ink);
            font-family: 'Rajdhani', sans-serif;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .display {
            font-family: 'Anton', sans-serif;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .mono {
            font-family: 'Space Mono', monospace;
        }

        button,
        input {
            font-family: inherit;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(10, 7, 5, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gold-line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .crest {
            width: 28px;
            height: 28px;
            background: linear-gradient(145deg, var(--gold-pale), var(--gold) 60%, var(--gold-deep));
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 100%, 50% 76%, 21% 100%, 32% 57%, 2% 35%, 39% 35%);
        }

        .brand-text {
            font-size: 15px;
            letter-spacing: 0.05em;
        }

        .brand-text b {
            color: var(--gold);
        }

        .tag {
            font-size: 9px;
            letter-spacing: 0.18em;
            color: var(--ink-faint);
            text-transform: uppercase;
        }

        .header-link {
            font-size: 11px;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        main {
            padding: 20px 16px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 10px;
            letter-spacing: 0.22em;
            color: var(--gold);
            text-transform: uppercase;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: '';
            width: 16px;
            height: 1px;
            background: var(--gold-deep);
        }

        .count-banner {
            text-align: center;
            padding: 8px 10px 18px;
        }

        .count-num {
            margin-top: 10px;
            font-family: 'Anton', sans-serif;
            font-size: 40px;
            color: var(--gold-pale);
            line-height: 1;
        }

        .count-lbl {
            margin-top: 4px;
            font-size: 11px;
            letter-spacing: 0.14em;
            color: var(--ink-faint);
            text-transform: uppercase;
        }

        .search-wrap {
            margin-top: 6px;
            margin-bottom: 16px;
        }

        .search-wrap input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font-size: 14px;
        }

        .search-wrap input:focus {
            outline: none;
            border-color: var(--gold-deep);
            box-shadow: 0 0 0 3px rgba(234, 179, 74, 0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .player-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--gold-line);
            border-radius: 16px;
            overflow: hidden;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-deep), var(--gold-pale), var(--gold-deep));
        }

        .player-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            background: var(--surface-2);
            overflow: hidden;
            cursor: pointer;
            margin-top: 3px;
        }

        .player-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .player-info {
            padding: 10px 11px 12px;
        }

        .player-id-lbl {
            font-size: 8px;
            letter-spacing: 0.14em;
            color: var(--ink-faint);
            text-transform: uppercase;
        }

        .player-name {
            margin-top: 2px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--gold-pale);
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-uid {
            margin-top: 3px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--ink-faint);
        }

        .level-badge {
            display: inline-block;
            margin-top: 7px;
            font-size: 9.5px;
            letter-spacing: 0.06em;
            padding: 3px 9px;
            border-radius: 100px;
            background: rgba(234, 179, 74, 0.1);
            color: var(--gold);
            font-weight: 700;
            border: 1px solid var(--gold-line);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-faint);
        }

        .empty-state .icon {
            font-size: 34px;
        }

        .empty-state p {
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.6;
        }

        .empty-state a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
        }

        /* LIGHTBOX */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(5, 3, 2, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lightbox.show {
            display: flex;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 14px;
            border: 1px solid var(--gold-line);
        }

        #lightboxClose {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--ink);
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <div class="crest"></div>
            <div>
                <div class="brand-text">FREEFIRE<b>XIPL</b></div>
                <div class="tag">Registered Players</div>
            </div>
        </div>
        <a class="header-link" href="registration.html">Register →</a>
    </header>

    <main>
        <div class="count-banner">
            <span class="eyebrow">Official Roster</span>
            <div class="count-num mono" id="countNum">—</div>
            <div class="count-lbl">Players Registered</div>
        </div>

        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search by name or UID...">
        </div>

        <div id="gridWrap">
            <div class="grid" id="grid"></div>
        </div>
    </main>

    <div id="lightbox">
        <button id="lightboxClose">✕</button>
        <img id="lightboxImg" alt="Screenshot">
    </div>

    <script>
        // ============================================================
        // CONFIG — paste your Supabase project values here
        // ============================================================
        const SUPABASE_URL = "https://izoysudepwjajyqqurfl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6b3lzdWRlcHdqYWp5cXF1cmZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mjg1NDgsImV4cCI6MjEwMTIwNDU0OH0.hSB09Hf56B8wJdFbHzrrI-F6ukw9SOm7FcwTFK1obLg";
        // ============================================================

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let PLAYERS = [];

        async function fetchPlayers() {
            const { data, error } = await sb.from('registrations')
                .select('id,ff_name,ff_uid,ff_level,screenshot_url,created_at')
                .eq('status', 'approved')
                .order('created_at', { ascending: false });
            PLAYERS = error ? [] : (data || []);
            render();
        }

        let realtimeTimer = null;
        function subscribeRealtime() {
            sb.channel('registered-players-room')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'registrations' }, () => {
                    clearTimeout(realtimeTimer); realtimeTimer = setTimeout(fetchPlayers, 150);
                })
                .subscribe();
        }

        function render() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = q
                ? PLAYERS.filter(p => p.ff_name.toLowerCase().includes(q) || p.ff_uid.toLowerCase().includes(q))
                : PLAYERS;

            document.getElementById('countNum').textContent = PLAYERS.length;

            const grid = document.getElementById('grid');
            if (filtered.length === 0) {
                grid.style.display = 'none';
                document.getElementById('gridWrap').innerHTML = `
        <div class="empty-state">
          <div class="icon">${PLAYERS.length === 0 ? '🎮' : '🔍'}</div>
          <p>${PLAYERS.length === 0
                        ? 'No players registered yet.<br><a href="registration.html">Be the first to register →</a>'
                        : 'No players match your search.'}</p>
        </div>`;
                return;
            }
            if (!document.getElementById('grid')) {
                document.getElementById('gridWrap').innerHTML = '<div class="grid" id="grid"></div>';
            }
            document.getElementById('grid').style.display = 'grid';
            document.getElementById('grid').innerHTML = filtered.map(p => `
      <div class="player-card">
        <div class="player-thumb" data-img="${p.screenshot_url}">
          <img src="${p.screenshot_url}" loading="lazy" alt="${p.ff_name}">
        </div>
        <div class="player-info">
          <div class="player-id-lbl">Player ID</div>
          <div class="player-name">${p.ff_name}</div>
          <div class="player-uid">UID ${p.ff_uid}</div>
          ${p.ff_level ? `<div class="level-badge">LVL ${p.ff_level}</div>` : ''}
        </div>
      </div>`).join('');
            document.querySelectorAll('.player-thumb').forEach(el => {
                el.addEventListener('click', () => openLightbox(el.dataset.img));
            });
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('show');
        }
        document.getElementById('lightboxClose').addEventListener('click', () => {
            document.getElementById('lightbox').classList.remove('show');
        });
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('show');
        });

        document.getElementById('searchInput').addEventListener('input', render);

        fetchPlayers();
        subscribeRealtime();
    </script>
</body>

</html>
